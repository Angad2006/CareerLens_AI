<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>
    <!-- Royal Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" />

  <g transform="translate(4, 4) scale(0.92)">
    <!-- Blue C (Outer) -->
    <path d="M 68,22 C 34,16 14,42 24,68 C 30,82 52,86 68,78" stroke="url(#blueGrad)" stroke-width="8.5" stroke-linecap="round" fill="none" />
    
    <!-- Gold L (Inner) -->
    <path d="M 44,36 L 44,64 L 62,64" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Gold AI Star (Sparkle) -->
    <path d="M 65,28 Q 65,38 55,38 Q 65,38 65,48 Q 65,38 75,38 Q 65,38 65,28 Z" fill="url(#goldGrad)" />
  </g>
</svg>